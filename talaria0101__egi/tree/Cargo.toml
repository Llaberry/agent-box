[workspace]
resolver = "3"
members = [
  "crates/egi-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
repository = "https://github.com/talaria0101/egi"
license = "0BSD"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
